# deal-hunter on Kubernetes: the monitor and its dashboard in one pod.
# Use it from your own overlay (see ../example) rather than editing it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deal-hunter
labels:
  - pairs:
      app.kubernetes.io/name: deal-hunter
    includeSelectors: false
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
images:
  # The tag moves with every build of main; the digest is what's pinned.
  # Bump both together (see ../../README.md).
  - name: ghcr.io/coreyjonoliver-labs/deal-hunter
    newTag: 0.3.0
    digest: sha256:f18291acd3d93e2c6c50301796459f1b0aa565a5d3b40b41bdf9ddbd9b9256da
