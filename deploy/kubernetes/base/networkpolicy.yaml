# Works with any NetworkPolicy-enforcing CNI.
#
# Ingress: the dashboard only, from namespaces you label
# deal-hunter/dashboard-access=true (your ingress controller's). Narrow it to
# the controller's pods in your overlay if you can: the dashboard has no
# login, so the proxy in front of it is its only control.
#
# Egress: DNS, and HTTPS to public addresses only (not your LAN, the node or
# cloud metadata). A plain NetworkPolicy can't match host names, so this
# still lets a compromised browser reach any public HTTPS site. The
# cilium-egress component replaces it with a Facebook + AI-provider
# allowlist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deal-hunter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: deal-hunter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              deal-hunter/dashboard-access: "true"
      ports:
        - {protocol: TCP, port: 8740}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            # Private, shared, link-local (cloud metadata) and reserved
            # ranges. Add your own public ingress, load balancer and node
            # IPs in your overlay: hairpinned requests to them can arrive
            # with an internal source address and pass "internal only"
            # allowlists. IPv6 egress isn't allowed at all; if you add
            # ::/0, except fc00::/7, fe80::/10 and ::1/128.
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 240.0.0.0/4
      ports:
        - {protocol: TCP, port: 443}
