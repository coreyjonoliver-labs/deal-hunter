# An example overlay: copy this directory next to your own manifests,
# point resources at the base (a local path, or a remote ref such as
# https://github.com/coreyjonoliver-labs/deal-hunter//deploy/kubernetes/base?ref=<commit>),
# put your settings in deal-hunter.toml, and create the two Secrets the
# Deployment names (see base/deployment.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deal-hunter
resources:
  - ../base
components:
  - ../components/kata           # drop if you have no Kata (or gVisor) runtime
  - ../components/cilium-egress  # drop if your CNI isn't Cilium
  - ../components/prometheus     # drop if you have no Prometheus Operator (also drop --metrics-port below)
configMapGenerator:
  - name: deal-hunter-config
    files:
      - deal-hunter.toml
# The image tag and digest come from the base. If you override them here, set
# both `newTag` and `digest` in the same `images:` entry: an entry that sets
# only `newTag` silently drops the base's digest. Check with
# `kustomize build . | grep image:` (every line should end in @sha256:...).
patches:
  # The host name your authenticating proxy serves the dashboard on. This
  # replaces the whole list: keep it in step with base/deployment.yaml's
  # web args when you update the base, and keep --metrics-port with the
  # prometheus component (the replacement drops the arguments it adds).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: deal-hunter
      spec:
        template:
          spec:
            containers:
              - name: web
                args:
                  - --settings
                  - /config/deal-hunter.toml
                  - web
                  - --host
                  - 0.0.0.0
                  - --port
                  - "8740"
                  - --metrics-port
                  - "9741"
                  - --allow-host
                  - deal-hunter.example.com
