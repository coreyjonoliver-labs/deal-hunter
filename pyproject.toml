[project]
name = "deal-hunter"
version = "0.3.0"
description = "Watch Facebook Marketplace for the things you want, judged and ranked by AI (a front-end for ai-marketplace-monitor)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  # Pinned: we generate config against this release's schema and prompt format.
  "ai-marketplace-monitor==0.10.2",
  "tomli-w>=1.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Traces over OTLP/HTTP, off unless OTEL_EXPORTER_OTLP_ENDPOINT is set (tracing.py).
# Pinned exactly, like aimm: the span processor and exporter wiring is written
# against this release's SDK. The image installs this extra.
tracing = [
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[project.scripts]
deal-hunter = "deal_hunter.cli:main"

[dependency-groups]
# The tracing packages are here too so CI's plain `uv sync --locked` runs tracing's tests.
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "opentelemetry-api==1.45.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_hunter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603"]  # subprocess with a fixed argv (no shell) is intentional in cli.run

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Claude Code sandbox denies even stat() on .env, which pytest's root scan trips on.
addopts = ["--ignore=.env"]
filterwarnings = ["ignore::DeprecationWarning:ai_marketplace_monitor.*", "ignore::DeprecationWarning:pyparsing.*", "ignore:.*deprecated.*:DeprecationWarning"]
