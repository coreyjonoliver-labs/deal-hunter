name: security
# Required checks on every PR to main, next to build.yml's test and image
# (spec graduate-established): a secret scan of the whole history, a review of
# newly added dependencies, and CodeQL over the Python code and the workflows.
# Pushes to main run the scans too, so CodeQL keeps main's alerts current.
# The codeql job only proves the analysis ran; new alerts block a PR through
# the "code scanning" rule in the main-code-scanning ruleset.
#
# A PR runs its own copy of this file, so a PR that edits it (or build.yml)
# defines its own checks: read such a diff by hand before merging.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a PR cancels its stale run; each push to main gets its own
# group, so no commit on main is skipped.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI (MIT), not the gitleaks-action wrapper, which needs a
      # license on organisation accounts. The checksum is from the release's
      # checksums.txt (unsigned, so it pins what was reviewed, trust on first
      # use). Installed outside the checkout so the PR's files can't collide.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir gitleaks-config
          printf '[extend]\nuseDefault = true\n' > gitleaks-config/gitleaks.toml
          : > gitleaks-config/.gitleaksignore
      # `git` scans every commit, so a secret added and removed within a PR
      # still fails. The scanned tree can't switch the scan off by its config:
      # the config and the (empty) ignore file come from here, not the repo's
      # .gitleaks.toml / .gitleaksignore, and gitleaks:allow comments are
      # ignored.
      #
      # gitleaks 8.30.1 also reports "no leaks found" and exits 0 when the git
      # command it runs fails or warns, or shows a file as "Binary files
      # differ", and a PR can cause either with a .gitattributes (a negative
      # pattern such as `!x foo`, or `* -diff`). Git also shows no diff for a
      # merge commit's own changes (a secret added while resolving a merge)
      # unless asked. So git reads attributes from the empty tree, ignores
      # replace refs, prints plain text, diffs merges against their first
      # parent and shows root commits, and the scan fails unless gitleaks
      # exits 0, logs no error and scans at least one commit (a checkout
      # always has some). gitleaks's default path allowlist (images, lockfiles
      # such as package-lock.json and go.sum, ...) still applies.
      # tests/test_ci_parity.py runs this step.
      - name: gitleaks
        env:
          GIT_ATTR_SOURCE: "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          status=0
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --no-color \
            --config "$RUNNER_TEMP/gitleaks-config/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-config" \
            --ignore-gitleaks-allow \
            --log-opts "--all --full-history --no-color --text --no-textconv --no-ext-diff --root --diff-merges=first-parent" \
            >"$RUNNER_TEMP/gitleaks.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gitleaks.log"
          if [ "$status" -ne 0 ]; then
            echo "gitleaks exited $status"
            exit 1
          fi
          if grep -q ' ERR ' "$RUNNER_TEMP/gitleaks.log"; then
            echo "gitleaks logged an error, so its result can't be trusted"
            exit 1
          fi
          scanned="$(sed -n 's/^.* INF \([0-9][0-9]*\) commits scanned\.$/\1/p' "$RUNNER_TEMP/gitleaks.log")"
          case "$scanned" in
            '' | 0 | *[!0-9]*)
              echo "gitleaks scanned no commits"
              exit 1
              ;;
          esac

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python, actions
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
