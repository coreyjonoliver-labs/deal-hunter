name: build
# Pull requests: tests, lint and a build-only image check (no push, no
# attestation). Pushes to main: the same checks, then build, publish to GHCR
# and attach SLSA build provenance signed by this workflow, so a consumer can
# verify the image came from this repo's main branch.
#
# Renaming this file or publishing from another branch changes the signing
# identity (.github/workflows/build.yml@refs/heads/main) that consumers
# verify.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
# One build of main at a time, in push order, so an older commit can't
# publish over a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.26"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # The image tag is the package version. Code changes between versions
      # keep the tag and get a new digest, which digest-pinned consumers pick up.
      - id: ver
        run: |
          tag="$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' pyproject.toml)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}

  # Signs the provenance in a job that checks out and runs no repository or
  # dependency code, so nothing that builds the image shares a job with the
  # OIDC token that signs it.
  attest:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}   # tag-less
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - run: echo "pushed ghcr.io/${{ github.repository }}:${{ needs.image.outputs.tag }}@${{ needs.image.outputs.digest }}"
