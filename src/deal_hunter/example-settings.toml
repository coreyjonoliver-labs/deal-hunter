# deal-hunter settings. Copy to deal-hunter.toml (`deal-hunter init` does this).
# No secrets go in this file — credentials come from environment variables.

[location]
# Facebook Marketplace location slug or numeric id: open Marketplace, search
# for anything near you, and copy XXX from facebook.com/marketplace/XXX/search
search_city = "CHANGE_ME"
radius = 25                 # miles
# Optional: only keep listings whose seller location contains one of these.
# seller_locations = ["Springfield", "Shelbyville"]

[search]
interval = "1h"             # random wait between interval and max_interval
max_interval = "2h"

# One [[watch]] per thing you're looking for. Each search phrase is a page
# load every interval, so keep the total small (Facebook throttles busy logins).
[[watch]]
name = "mini PC"            # the AI reads "A user wants to buy a <name>"
# A preset brings tuned search phrases, keywords and AI prompt: mini-pc
# (NUC, Beelink, Minisforum...) or tiny-pc (ThinkCentre Tiny, OptiPlex Micro...).
preset = "mini-pc"
min_price = 40              # filters out $1 "placeholder" listings
max_price = 400
allow_barebones = true      # false drops listings that say barebone / no RAM / no SSD
# What you want, in plain words. The AI judges every listing against this.
preferences = """\
Mini PC for a home server. Prefer Intel 8th gen or newer (or N100 and newer), \
or AMD Ryzen 4000 series or newer. 16GB+ RAM preferred, upgradeable. Power \
adapter must be included.\
"""
# antikeywords = ["celeron j4125"]   # drop listings that mention any of these

# Without a preset, give the search phrases yourself.
# [[watch]]
# name = "standing desk"
# search_phrases = ["standing desk", "sit stand desk"]
# # A listing must mention one of these to reach the AI. Leave it out and the
# # AI rates everything the searches find (costs more, misses less). On a
# # preset watch, keywords replaces the preset's list; [] turns the gate off.
# keywords = ["desk"]
# antikeywords = ["kids", "desk lamp"]
# min_price = 50
# max_price = 350
# rating = 4                # notify at this rating or higher (default: ai.rating)
# preferences = "Electric, dual motor, at least 60 inches wide, with memory presets."

[ai]
provider = "anthropic"      # anthropic | openai | ollama | none
# model = "claude-haiku-4-5-20251001"
rating = 3                  # notify for AI rating >= this (1-5), unless a watch sets its own
# base_url = "http://localhost:11434/v1"   # ollama only

[notify]
# Any of: ntfy, pushover, telegram, pushbullet, email, discord. Empty = console only.
# discord posts a card per deal to the webhook in the DISCORD_WEBHOOK_URL env var
# (never put the URL here); try it with `deal-hunter notify-test`.
methods = []
# ntfy_server = "https://ntfy.sh"   # ntfy only; set for a self-hosted server
# email = "you@example.com"         # required for the email method
# smtp_server = "smtp.example.com"  # email only; default smtp.<your domain>
# smtp_username = "you@example.com" # email only; default is the address
# smtp_port = 587

[facebook]
# true = no login, headless browser. Fewer results; Facebook may block sooner.
anonymous = false
# Where `deal-hunter login` saves your Facebook login for `run` to reuse.
# session_file = "~/.ai-marketplace-monitor/facebook-session.json"
# true = headless, and exit with an error instead of waiting for a login when
# the saved session is missing or expired. For unattended runs (a server).
# require_session = false
# Chromium's sandbox. Only set false where it can't start (some containers).
# browser_sandbox = true
